{% extends 'base.html' %}
{% load static %}
{% block title %}NordPet - Settings{% endblock %}
{% block content %}
    <!-- Main Content Area -->
    <div class="flex-1 px-4 md:px-6 pb-12 max-w-7xl mx-auto w-full mt-8 flex justify-center items-start pt-8">
        <!-- Settings Card -->
        <div class="bg-white rounded-[32px] shadow-sm border border-gray-100 w-full max-w-2xl p-10 md:p-12 relative overflow-hidden">
            <!-- Decorative Header Elements -->
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-teal-600 to-teal-400"></div>
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-teal-50 rounded-full opacity-50 blur-xl"></div>
            <div class="absolute -bottom-16 -left-16 w-48 h-48 bg-teal-50 rounded-full opacity-50 blur-2xl"></div>
            <!-- Header Content -->
            <div class="relative z-10 flex flex-col items-center mb-10">
                <div class="w-16 h-16 bg-teal-50 text-teal-700 rounded-full flex items-center justify-center mb-4 shadow-sm border border-teal-100 overflow-hidden">
                    {% if user.photo %}
                        <img src="{{ user.photo.url }}" class="w-full h-full object-cover">
                    {% else %}
                        <span class="material-symbols-outlined text-[32px]">settings</span>
                    {% endif %}
                </div>
                <h2 class="text-3xl font-bold text-primary mb-2">My Settings</h2>
            </div>
            <!-- Settings Form -->
            <form class="relative z-10 flex flex-col gap-6"
                  method="POST"
                  action="{% url 'users:settings' %}"
                  enctype="multipart/form-data">
                {% csrf_token %}
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Photo Field -->
                    <div class="flex flex-col gap-2 md:col-span-2">
                        <label class="font-medium text-sm text-gray-700 pl-4">Photo (Leave empty to keep current)</label>
                        <div class="flex items-center gap-4 pl-4">
                            <label class="cursor-pointer bg-teal-50 text-teal-700 hover:bg-teal-600 hover:text-white px-5 py-2 rounded-full text-sm font-semibold transition-colors flex items-center gap-2">
                                <span class="material-symbols-outlined text-[18px]">upload</span>
                                Choose File
                                <input type="file"
                                       id="photo"
                                       name="photo"
                                       accept="image/*"
                                       class="hidden"
                                       onchange="document.getElementById('fileName').textContent = this.files[0] ? this.files[0].name : 'No new file chosen'" />
                            </label>
                            <span id="fileName" class="text-sm text-gray-500">No new file chosen</span>
                        </div>
                    </div>
                    <!-- First Name Field -->
                    <div class="flex flex-col gap-2">
                        <label class="font-medium text-sm text-gray-700 pl-4" for="first_name">First Name</label>
                        <div class="relative group">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-teal-600 transition-colors text-[20px]">person</span>
                            <input value="{{ user.first_name }}"
                                   class="w-full bg-gray-50 border border-gray-200 focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 rounded-full py-3 pl-12 pr-4 text-gray-900 placeholder-gray-400 outline-none transition-all"
                                   id="first_name"
                                   name="first_name"
                                   required
                                   type="text" />
                        </div>
                    </div>
                    <!-- Last Name Field -->
                    <div class="flex flex-col gap-2">
                        <label class="font-medium text-sm text-gray-700 pl-4" for="last_name">Last Name</label>
                        <div class="relative group">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-teal-600 transition-colors text-[20px]">person</span>
                            <input value="{{ user.last_name }}"
                                   class="w-full bg-gray-50 border border-gray-200 focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 rounded-full py-3 pl-12 pr-4 text-gray-900 placeholder-gray-400 outline-none transition-all"
                                   id="last_name"
                                   name="last_name"
                                   required
                                   type="text" />
                        </div>
                    </div>
                    <!-- Email Field -->
                    <div class="flex flex-col gap-2">
                        <label class="font-medium text-sm text-gray-700 pl-4" for="email">Email Address</label>
                        <div class="relative group">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-teal-600 transition-colors text-[20px]">mail</span>
                            <input value="{{ user.email }}"
                                   class="w-full bg-gray-50 border border-gray-200 focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 rounded-full py-3 pl-12 pr-4 text-gray-900 placeholder-gray-400 outline-none transition-all"
                                   id="email"
                                   name="email"
                                   required
                                   type="email" />
                        </div>
                    </div>
                    <!-- Phone Field -->
                    <div class="flex flex-col gap-2">
                        <label class="font-medium text-sm text-gray-700 pl-4" for="phone">Phone Number</label>
                        <div class="relative group">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-teal-600 transition-colors text-[20px]">call</span>
                            <input value="{{ user.phone }}"
                                   class="w-full bg-gray-50 border border-gray-200 focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 rounded-full py-3 pl-12 pr-4 text-gray-900 placeholder-gray-400 outline-none transition-all"
                                   id="phone"
                                   name="phone"
                                   required
                                   type="tel" />
                        </div>
                    </div>
                    <!-- Password Field (Optional) -->
                    <div class="flex flex-col gap-2 md:col-span-2">
                        <label class="font-medium text-sm text-gray-700 pl-4" for="password">New Password (Leave empty to keep current)</label>
                        <div class="relative group">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-teal-600 transition-colors text-[20px]">lock</span>
                            <input class="w-full bg-gray-50 border border-gray-200 focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 rounded-full py-3 pl-12 pr-4 text-gray-900 placeholder-gray-400 outline-none transition-all"
                                   id="password"
                                   name="password"
                                   type="password" />
                        </div>
                    </div>
                </div>
                <!-- Submit Button -->
                <button class="mt-6 w-full bg-teal-600 text-white font-semibold rounded-full py-3 px-8 hover:-translate-y-0.5 hover:shadow-lg hover:bg-teal-700 transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer"
                        type="submit">
                    <span>Save Settings</span>
                    <span class="material-symbols-outlined text-[20px]">save</span>
                </button>
            </form>
        </div>
    </div>
{% endblock %}
