services:
  db:
    image: postgres:16-alpine
    container_name: nordpet_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nordpet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: nordpet_web
    command: bash -c "python manage.py migrate && gunicorn core.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db 
    depends_on:
      - db
    restart: always

  worker:
    build: .
    container_name: nordpet_worker
    command: python manage.py qcluster
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      - db
    restart: always

volumes:
  pgdata:
