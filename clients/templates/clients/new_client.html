{% extends 'base.html' %}
{% load static %}
{% block title %}NordPet - New Registration{% endblock %}
{% block content %}
    <!-- Main Content Area -->
    <div class="flex-1 px-4 md:px-6 pb-12 max-w-7xl mx-auto w-full mt-8">
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-teal-900 mb-1">New Client</h2>
            <p class="text-gray-500">Register a new client and their pet in the system.</p>
        </div>
        <form class="space-y-12"
              method="POST"
              action="{% url 'clients:new_client' %}"
              enctype="multipart/form-data">
            {% csrf_token %}
            <!-- Client Information Card -->
            <div class="bg-surface-container-lowest rounded-[32px] shadow-md p-6 border border-surface-variant hover:shadow-lg transition-shadow duration-300 border-t-4 border-t-primary">
                <div class="flex items-center gap-4 mb-6 pb-4 border-b border-border-teal">
                    <div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary">
                        <span class="material-symbols-outlined">person</span>
                    </div>
                    <h3 class="font-bold text-lg text-on-surface">Client Information</h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="font-body-sm text-body-sm text-on-surface-variant ml-3"
                               for="name">Full Name</label>
                        <input class="w-full rounded-full border-2 border-border-teal bg-surface px-4 py-2 focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md focus:ring-2 focus:ring-primary/20"
                               id="name"
                               name="name"
                               placeholder="Aino Nieminen"
                               type="text"
                               required />
                    </div>
                    <div class="space-y-2">
                        <label class="font-body-sm text-body-sm text-on-surface-variant ml-3"
                               for="email">Email Address</label>
                        <input class="w-full rounded-full border-2 border-border-teal bg-surface px-4 py-2 focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md focus:ring-2 focus:ring-primary/20"
                               id="email"
                               name="email"
                               placeholder="ainonieminen@example.com"
                               type="email"
                               required />
                    </div>
                    <div class="space-y-2 md:col-span-2">
                        <label class="font-body-sm text-body-sm text-on-surface-variant ml-3"
                               for="phone">Phone Number</label>
                        <input class="w-full md:w-1/2 rounded-full border-2 border-border-teal bg-surface px-4 py-2 focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md focus:ring-2 focus:ring-primary/20"
                               id="phone"
                               name="phone"
                               placeholder="(358) 123-456789"
                               type="tel"
                               required />
                    </div>
                </div>
            </div>
            <!-- Pet Information Card -->
            <div class="bg-surface-container-lowest rounded-[32px] shadow-md p-6 border border-surface-variant hover:shadow-lg transition-shadow duration-300 border-t-4 border-t-secondary-container">
                <div class="flex items-center gap-4 mb-6 pb-4 border-b border-border-teal">
                    <div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-secondary-container">
                        <span class="material-symbols-outlined">pets</span>
                    </div>
                    <h3 class="font-bold text-lg text-on-surface">Pet Information</h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2 md:col-span-2">
                        <label class="font-body-sm text-body-sm text-on-surface-variant ml-3">Pet Photo (Optional)</label>
                        <div class="flex items-center gap-4 ml-3">
                            <label class="cursor-pointer bg-secondary-container text-on-secondary-container hover:bg-secondary-fixed-dim px-2.5 py-0.5 rounded-full text-[12px] font-semibold transition-colors flex items-center gap-1">
                                <span class="material-symbols-outlined text-[10px]">upload</span>
                                Choose File
                                <input type="file"
                                       id="petPhoto"
                                       name="petPhoto"
                                       accept="image/*"
                                       class="hidden"
                                       onchange="document.getElementById('fileName').textContent = this.files[0] ? this.files[0].name : 'No file chosen'" />
                            </label>
                            <span id="fileName" class="text-sm text-on-surface-variant">No file chosen</span>
                        </div>
                    </div>
                    <div class="space-y-2 md:col-span-2">
                        <label class="font-body-sm text-body-sm text-on-surface-variant ml-3"
                               for="animal_name">Pet Name</label>
                        <input class="w-full md:w-1/2 rounded-full border-2 border-border-teal bg-surface px-4 py-2 focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md focus:ring-2 focus:ring-primary/20"
                               id="animal_name"
                               name="animal_name"
                               placeholder="Luna"
                               type="text"
                               required />
                    </div>
                    <div class="space-y-2">
                        <label class="font-body-sm text-body-sm text-on-surface-variant ml-3"
                               for="specie">Species</label>
                        <select class="w-full rounded-full border-2 border-border-teal bg-surface px-4 py-2 focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md appearance-none focus:ring-2 focus:ring-primary/20 cursor-pointer"
                                id="specie"
                                name="specie"
                                required>
                            <option value="" disabled selected>Select species...</option>
                            <option value="dog">Dog</option>
                            <option value="cat">Cat</option>
                            <option value="bird">Bird</option>
                            <option value="reptile">Reptile</option>
                            <option value="rabbit">Rabbit</option>
                            <option value="hamsters">Hamsters</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="font-body-sm text-body-sm text-on-surface-variant ml-3"
                               for="breed">Breed</label>
                        <input class="w-full rounded-full border-2 border-border-teal bg-surface px-4 py-2 focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md focus:ring-2 focus:ring-primary/20"
                               id="breed"
                               name="breed"
                               placeholder="Golden Retriever"
                               type="text"
                               required />
                    </div>
                    <div class="space-y-2">
                        <label class="font-body-sm text-body-sm text-on-surface-variant ml-3 block mb-2">Gender</label>
                        <div class="flex gap-4">
                            <label class="flex-1 cursor-pointer">
                                <input class="peer sr-only" name="gender" type="radio" value="M" />
                                <div class="text-center py-2 rounded-full border-2 border-border-teal peer-checked:border-primary peer-checked:bg-surface-container text-on-surface-variant peer-checked:text-primary transition-all font-body-sm text-body-sm">
                                    Male
                                </div>
                            </label>
                            <label class="flex-1 cursor-pointer">
                                <input class="peer sr-only" name="gender" type="radio" value="F" />
                                <div class="text-center py-2 rounded-full border-2 border-border-teal peer-checked:border-primary peer-checked:bg-surface-container text-on-surface-variant peer-checked:text-primary transition-all font-body-sm text-body-sm">
                                    Female
                                </div>
                            </label>
                            <label class="flex-1 cursor-pointer">
                                <input checked="" class="peer sr-only" name="gender" type="radio" value="U" />
                                <div class="text-center py-2 rounded-full border-2 border-border-teal peer-checked:border-primary peer-checked:bg-surface-container text-on-surface-variant peer-checked:text-primary transition-all font-body-sm text-body-sm">
                                    Unknown
                                </div>
                            </label>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="font-body-sm text-body-sm text-on-surface-variant ml-3"
                               for="date_of_birth">Date of Birth</label>
                        <div class="flex flex-col gap-3">
                            <input class="w-full rounded-full border-2 border-border-teal bg-surface px-4 py-2 focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md focus:ring-2 focus:ring-primary/20"
                                   id="date_of_birth"
                                   name="date_of_birth"
                                   type="date" />
                            <div class="flex items-center gap-2 ml-3">
                                <input type="checkbox"
                                       id="estimate_date"
                                       name="estimate_date"
                                       class="w-4 h-4 text-primary bg-surface border-border-teal rounded focus:ring-primary focus:ring-2 cursor-pointer">
                                <label for="estimate_date"
                                       class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer">Estimated Date</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Form Actions -->
            <div class="flex justify-end gap-4 pt-4">
                <a href="{% url 'users:dashboard' %}"
                   class="px-6 py-4 rounded-full font-button-text text-button-text text-primary hover:bg-surface-container-high transition-colors text-center inline-flex items-center">
                    Cancel
                </a>
                <button class="px-8 py-4 rounded-full bg-primary text-on-primary font-button-text text-button-text hover:bg-surface-tint transition-all shadow-md hover:shadow-lg hover:-translate-y-1 cursor-pointer"
                        type="submit">
                    <span class="flex items-center justify-center gap-3">
                        <span class="material-symbols-outlined">check_circle</span>
                        Complete Registration
                    </span>
                </button>
            </div>
        </form>
    </div>
{% endblock %}
