{% extends 'base.html' %}
{% load static %}
{% block title %}NordPet - Update Client{% endblock %}
{% block content %}
    <!-- Main Content Area -->
    <div class="flex-1 px-4 md:px-6 pb-12 max-w-7xl mx-auto w-full mt-8">
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-teal-900 mb-1">Edit Client</h2>
            <p class="text-gray-500">Edit the information of the selected client.</p>
        </div>
        <form class="space-y-12"
              method="POST"
              action="{% url 'clients:update_client' client.id %}"
              enctype="multipart/form-data">
            {% csrf_token %}
            <!-- Client Information Card -->
            <div class="bg-surface-container-lowest rounded-[32px] shadow-md p-6 border border-surface-variant hover:shadow-lg transition-shadow duration-300 border-t-4 border-t-primary">
                <div class="flex items-center gap-4 mb-6 pb-4 border-b border-border-teal">
                    <div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary">
                        <span class="material-symbols-outlined">person</span>
                    </div>
                    <h3 class="font-bold text-lg text-on-surface">Client Information</h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="font-body-sm text-body-sm text-on-surface-variant ml-3"
                               for="name">Full Name</label>
                        <input class="w-full rounded-full border-2 border-border-teal bg-surface px-4 py-2 focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md focus:ring-2 focus:ring-primary/20"
                               id="name"
                               name="name"
                               value="{{ client.name }}"
                               type="text"
                               required />
                    </div>
                    <div class="space-y-2">
                        <label class="font-body-sm text-body-sm text-on-surface-variant ml-3"
                               for="email">Email Address</label>
                        <input class="w-full rounded-full border-2 border-border-teal bg-surface px-4 py-2 focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md focus:ring-2 focus:ring-primary/20"
                               id="email"
                               name="email"
                               value="{{ client.email }}"
                               type="email"
                               required />
                    </div>
                    <div class="space-y-2 md:col-span-2">
                        <label class="font-body-sm text-body-sm text-on-surface-variant ml-3"
                               for="phone">Phone Number</label>
                        <input class="w-full md:w-1/2 rounded-full border-2 border-border-teal bg-surface px-4 py-2 focus:border-primary focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md focus:ring-2 focus:ring-primary/20"
                               id="phone"
                               name="phone"
                               value="{{ client.phone }}"
                               type="tel"
                               required />
                    </div>
                </div>
            </div>
            
            <!-- Form Actions -->
            <div class="flex justify-between items-center pt-4">
                <button type="submit"
                        formaction="{% url 'clients:delete_client' client.id %}"
                        onclick="return confirm('Are you sure you want to permanently delete this client? All pets belonging to this client will also be deleted.');"
                        class="px-6 py-4 rounded-full font-button-text text-button-text text-error-red bg-red-200 hover:bg-error-container transition-colors text-center inline-flex items-center gap-2 cursor-pointer">
                    <span class="material-symbols-outlined">delete</span>
                    Delete Client
                </button>
                <div class="flex gap-4">
                    <a href="{% url 'clients:client_list' %}"
                       class="px-6 py-4 rounded-full font-button-text text-button-text text-primary hover:bg-surface-container-high transition-colors text-center inline-flex items-center">
                        Cancel
                    </a>
                    <button class="px-8 py-4 rounded-full bg-primary text-on-primary font-button-text text-button-text hover:bg-surface-tint transition-all shadow-md hover:shadow-lg hover:-translate-y-1 cursor-pointer"
                            type="submit">
                        <span class="flex items-center justify-center gap-3">
                            <span class="material-symbols-outlined">save</span>
                            Save Changes
                        </span>
                    </button>
                </div>
            </div>
        </form>
    </div>
{% endblock %}
